[package]
name = "src-ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Event", "CustomEvent", "MediaQueryList"] }
uuid = { version = "1", features = ["v4", "js"] }
sun = "0.2.0" # For day/night indicator calculations
chrono = { version = "0.4", features = ["wasmbind"] }
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
