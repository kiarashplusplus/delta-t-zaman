<!doctype html>
<html lang="en" data-theme="system" data-reduced-motion="false">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delta-T Zaman</title>
    <link rel="stylesheet" href="/src/styles/main.css">
  </head>
  <body>
    <div id="app">
      <nav class="tabs-container">
        <button id="tab-clocks" class="tab active" aria-selected="true" aria-controls="panel-clocks">Clocks</button>
        <button id="tab-alarms" class="tab" aria-selected="false" aria-controls="panel-alarms">Alarms</button>
        <button id="tab-settings" class="tab" aria-selected="false" aria-controls="panel-settings">Settings</button>
      </nav>

      <main class="content-area">
        <div id="panel-clocks" class="panel active" role="tabpanel" aria-labelledby="tab-clocks"></div>
        <div id="panel-alarms" class="panel hidden" role="tabpanel" aria-labelledby="tab-alarms" hidden></div>
        <div id="panel-settings" class="panel hidden" role="tabpanel" aria-labelledby="tab-settings" hidden></div>
      </main>

      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
